name: openetra
description: "Openetra — Offline-first, low-power AI visual independence platform."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  crypto: ^3.0.3
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/models/mirage.cact
    - assets/models/tessdata/hin.traineddata
    - assets/models/tessdata/mar.traineddata
    - assets/models/tessdata/kan.traineddata
    - assets/models/tessdata/tam.traineddata
    - assets/models/tessdata/tel.traineddata
    - assets/models/tessdata/mal.traineddata
    - assets/models/tessdata/ben.traineddata
    - assets/models/vad/silero_vad.int8.onnx
    - assets/test_fixtures/stop_sign_231049.jpg
    - assets/test_fixtures/living_room_139.jpg
