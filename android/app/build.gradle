plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.openetra.app"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.openetra.app"
        minSdk = 26
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
            if (System.getProperty("os.name").toLowerCase().contains("mac") &&
                rootProject.projectDir.absolutePath.startsWith("/Volumes/")) {
                buildStagingDirectory = new File(System.getProperty("java.io.tmpdir"), "openetra_android_cxx")
            }
        }
    }

    buildTypes {
        release {
            // Signing with the debug keys for local testing builds; replace for store release.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    def cameraxVersion = "1.3.4"
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    androidTestImplementation "androidx.test:runner:1.6.1"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}

flutter {
    source = "../.."
}

if (System.getProperty("os.name").toLowerCase().contains("mac") &&
    rootProject.projectDir.absolutePath.startsWith("/Volumes/")) {
    afterEvaluate {
        tasks.matching { it.name == "assembleDebug" || it.name == "assembleRelease" }.configureEach {
            doLast {
                def srcDir = new File("${project.buildDir}/outputs/flutter-apk")
                if (srcDir.exists()) {
                    def dstDir = new File(rootProject.projectDir.parentFile, "build/app/outputs/flutter-apk")
                    dstDir.mkdirs()
                    srcDir.listFiles()?.each { f ->
                        if (f.name.endsWith(".apk") || f.name.endsWith(".sha1")) {
                            java.nio.file.Files.copy(
                                f.toPath(),
                                new File(dstDir, f.name).toPath(),
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING
                            )
                        }
                    }
                }
            }
        }
    }
}
