allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

def isMacExternalVolume = System.getProperty("os.name").toLowerCase().contains("mac") &&
    rootProject.projectDir.absolutePath.startsWith("/Volumes/")

rootProject.buildDir = isMacExternalVolume
    ? new File(System.getProperty("java.io.tmpdir"), "openetra_android_build")
    : file("../build")

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
